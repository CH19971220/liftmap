<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LiftMap v2</title>
<meta name="description" content="LiftMap v2 - Periodizacao de forca com cargas pre-calculadas">
<meta name="theme-color" content="#0f0f1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--accent:#4361ee;--accent2:#7209b7;--success:#06d6a0;--warning:#ffd166;--danger:#ef476f;--text:#e8e8e8;--text2:#8b8b9e;--text3:#555568;--border:#2a2a3e;--input-bg:#12121f;--tab-bg:#141425;--blue:#3a86ff;--orange:#ff9f43}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px}
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 12px}
.header-top{display:flex;align-items:center;justify-content:space-between}
.header-brand{font-size:14px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.week-sel{display:flex;gap:4px}
.week-btn{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;color:var(--text3);font-size:11px;font-weight:700;padding:6px 10px;cursor:pointer;min-width:36px;text-align:center}
.week-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.week-btn.deload{border-color:var(--warning)}
.week-btn.deload.active{background:#33301a;border-color:var(--warning);color:var(--warning)}
.header-sub{font-size:11px;color:var(--text3);margin-top:4px;text-align:center}
.deload-banner{background:#33301a;border:1px solid var(--warning);border-radius:8px;padding:8px 12px;margin:8px 12px;font-size:12px;color:var(--warning);text-align:center;font-weight:600}
.content{padding:8px 10px 16px}
.section-header{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin:16px 0 8px;padding:0 4px;display:flex;align-items:center;gap:6px}
.section-header:first-child{margin-top:4px}
.exercise-card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.ex-name{font-size:14px;font-weight:600;flex:1;line-height:1.3}
.video-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;white-space:nowrap;margin-left:6px;flex-shrink:0}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600}
.badge-left{background:#1a3a2e;color:var(--success);border:1px solid var(--success)}
.badge-extra{background:#3a2a1a;color:var(--warning);border:1px solid var(--warning)}
.badge-asym{background:#2e1a2e;color:#c77dff;border:1px solid #c77dff}
.ex-note{font-size:10px;color:var(--text3);font-style:italic;margin:3px 0 6px;line-height:1.3}
.set-row{display:flex;align-items:center;padding:8px 6px;border-radius:8px;margin-bottom:3px;cursor:pointer;background:var(--input-bg);border:1px solid transparent;transition:all .15s;gap:6px}
.set-row:active{transform:scale(.98)}
.set-row.done{background:#0d1f17;border-color:#1a3a2e}
.set-row.done .set-weight,.set-row.done .set-reps{opacity:.6}
.set-num{font-size:11px;font-weight:700;color:var(--text2);min-width:22px}
.set-num.extra{color:var(--warning)}
.set-weight{font-size:16px;font-weight:700;min-width:52px}
.set-weight.bw{color:var(--text2);font-size:13px}
.set-x{font-size:12px;color:var(--text3);margin:0 1px}
.set-reps{font-size:15px;font-weight:600;min-width:28px}
.set-tag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;margin-left:auto;white-space:nowrap}
.set-check{font-size:16px;min-width:20px;text-align:center;margin-left:4px}
.tag-aq{background:#1a2a3a;color:var(--blue)}
.tag-med{background:#33301a;color:var(--warning)}
.tag-wk{background:#1a3a2e;color:var(--success)}
.tag-extra{background:#3a2a1a;color:var(--orange)}
.tag-bw{background:#2a2a3e;color:var(--text2)}
.tag-dl{background:#33301a;color:var(--warning)}
.progress-bar{height:3px;background:var(--border);border-radius:2px;margin:6px 4px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--success);border-radius:2px;transition:width .3s}
.bottom-tabs{position:fixed;bottom:0;left:0;right:0;background:var(--tab-bg);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;padding:8px 4px 6px;background:none;border:none;color:var(--text3);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab-btn.active{color:var(--accent)}
.tab-btn .ti{font-size:18px}
.tab-btn .tl{font-size:9px;font-weight:600}
.info-section{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.info-section h3{font-size:13px;margin-bottom:6px;color:var(--accent)}
.info-section p,.info-section li{font-size:12px;color:var(--text2);line-height:1.5}
.info-section ul{padding-left:14px}
.info-section li{margin-bottom:3px}
.info-table{width:100%;border-collapse:collapse;margin-top:6px}
.info-table th,.info-table td{text-align:left;padding:5px 6px;font-size:11px;border-bottom:1px solid var(--border)}
.info-table th{color:var(--accent);font-weight:600}
.info-table td{color:var(--text2)}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.cfg-row:last-child{border:none}
.cfg-label{font-size:12px;color:var(--text2);flex:1}
.cfg-input{background:var(--input-bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;padding:6px 8px;width:64px;text-align:center}
.cfg-input:focus{border-color:var(--accent);outline:none}
.cfg-unit{font-size:10px;color:var(--text3);margin-left:4px;min-width:44px}
.cfg-group{margin-top:12px;padding-top:8px;border-top:1px solid var(--border)}
.cfg-group-title{font-size:11px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.save-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
.export-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;margin:4px 0;width:100%}
.import-label{display:block;background:var(--card);color:var(--accent);border:1px dashed var(--accent);border-radius:8px;padding:10px;font-size:13px;cursor:pointer;text-align:center;margin:4px 0}
.import-label input{display:none}
</style>
</head>
<body>

<div id="lock-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px">
  <div style="text-align:center;margin-bottom:32px">
    <div style="font-size:48px">&#127947;&#65039;</div>
    <div style="font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">LiftMap</div>
    <div style="font-size:12px;color:var(--text2);margin-top:4px">Forca + Hipertrofia v2.1</div>
  </div>
  <input id="pwd-input" type="password" placeholder="Senha" style="background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;padding:12px 16px;width:100%;max-width:260px;text-align:center;margin-bottom:12px" onkeydown="if(event.key==='Enter')checkPwd()">
  <button onclick="checkPwd()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%;max-width:260px">Entrar</button>
  <p id="pwd-error" style="color:var(--danger);font-size:12px;margin-top:8px;display:none">Senha incorreta</p>
</div>

<div id="app-wrapper" style="display:none">

      <span class="header-brand" id="headerTitle">LiftMap</span>

    </div>
    <div class="header-sub" id="headerSub"></div>
  </div>
  <div class="content" id="content"></div>

</div>

const TAG_STYLES={
  aq:{cls:'tag-aq',label:'Aquec'},
  med:{cls:'tag-med',label:'Medio'},
  wk:{cls:'tag-wk',label:'Trabalho'},
  extra:{cls:'tag-extra',label:'Extra esq'},
};

function setRow(day,exId,idx,label,weightHtml,reps,tagHtml,isExtra){
  const done=isDone(day,exId,idx);
  let html=`<div class="set-row${done?' done':''}" onclick="toggleSet('${day}','${exId}',${idx},this)">`;
  html+=`<span class="set-num${isExtra?' extra':''}">${label}</span>`;
  html+=weightHtml;
  html+=`<span class="set-x">\u00D7</span>`;
  html+=`<span class="set-reps">${reps}</span>`;
  html+=tagHtml;
  html+=`<span class="set-check">${done?'\u2713':'\u25CB'}</span>`;
  html+=`</div>`;
  return html;
}

function renderBarbellSets(ex,day){
  const w=CFG.week-1;
  const sets=ex.ws[w];
  const max=CFG[ex.maxKey];
  let html='';
  sets.forEach((s,i)=>{
    const kg=r2(max*s.p);
    const pct=Math.round(s.p*100);
    const isExtra=s.t==='extra';
    const label=isExtra?'E+':'S'+(i+1);
    const ts=TAG_STYLES[s.t];
    const weightHtml=`<span class="set-weight">${kg}kg</span>`;
    const tagHtml=`<span class="set-tag ${ts.cls}">${ts.label} ~${pct}%</span>`;
    html+=setRow(day,ex.id,i,label,weightHtml,s.r,tagHtml,isExtra);
  });
  return html;
}

function wtRamp(n){
  // Retorna array de multiplicadores por serie (aquec -> trabalho)
  if(n<=1)return [[1,'wk']];
  if(n===2)return [[.85,'med'],[1,'wk']];
  if(n===3)return [[.75,'aq'],[.88,'med'],[1,'wk']];
  if(n===4)return [[.70,'aq'],[.82,'med'],[.94,'med'],[1,'wk']];
  // 5+: primeira aquec, segunda medio, resto trabalho
  const arr=[[.70,'aq'],[.85,'med']];
  for(let i=2;i<n;i++)arr.push([1,'wk']);
  return arr;
}

function renderWeightedSets(ex,day){
  const wt=CFG[ex.cfgKey];
  const deload=CFG.week===4;
  const workWt=deload?wt*0.8:wt;
  const unit=ex.unit||'kg';
  const hasExtra=ex.badges&&ex.badges.includes('extra');
  const baseSets=deload?Math.max(2,ex.sets-1):ex.sets;
  const ramp=wtRamp(baseSets);
  const totalSets=baseSets+(deload?0:(hasExtra?1:0));
  let html='';
  for(let i=0;i<totalSets;i++){
    const isExtra=!deload&&hasExtra&&i===totalSets-1;
    const label=isExtra?'E+':'S'+(i+1);
    const reps=isExtra?ex.reps.replace('/lado',' esq'):ex.reps;
    let kg,tagKey;
    if(isExtra){kg=r2(workWt*.85);tagKey='extra';}
    else{const[m,k]=ramp[i];kg=r2(workWt*m);tagKey=k;}
    const displayKg=kg<1?workWt.toFixed(1):kg;
    const weightHtml=`<span class="set-weight">${displayKg}${unit}</span>`;
    let tagHtml;
    if(isExtra)tagHtml=`<span class="set-tag tag-extra">Extra esq</span>`;
    else if(deload)tagHtml=`<span class="set-tag tag-dl">Deload</span>`;
    else{const ts=TAG_STYLES[tagKey];tagHtml=`<span class="set-tag ${ts.cls}">${ts.label}</span>`;}
    html+=setRow(day,ex.id,i,label,weightHtml,reps,tagHtml,isExtra);
  }
  return html;
}

function renderBWSets(ex,day){
  const deload=CFG.week===4;
  const totalSets=deload?Math.max(1,ex.sets-1):ex.sets;
  let html='';
  for(let i=0;i<totalSets;i++){
    const label='S'+(i+1);
    const weightHtml=`<span class="set-weight bw">PC</span>`;
    const tagHtml=`<span class="set-tag tag-bw">Peso corporal</span>`;
    html+=setRow(day,ex.id,i,label,weightHtml,ex.reps,tagHtml,false);
  }
  return html;
}

function renderExercise(ex,day){
  let html=`<div class="exercise-card">`;
  html+=`<div class="ex-top"><span class="ex-name">${ex.name}</span>`;
  if(ex.video)html+=`<button class="video-btn" onclick="event.stopPropagation();window.open('https://www.youtube.com/results?search_query=${encodeURIComponent(ex.video)}','_blank')">\u25B6 Video</button>`;
  html+=`</div>`;

  if(ex.badges&&ex.badges.length){
    html+=`<div class="badges">`;
    if(ex.badges.includes('left'))html+=`<span class="badge badge-left">\u2B05 Esq primeiro</span>`;
    if(ex.badges.includes('extra'))html+=`<span class="badge badge-extra">+ Extra esq</span>`;
    if(ex.badges.includes('asym'))html+=`<span class="badge badge-asym">\u2696 Assim (E>D)</span>`;
    html+=`</div>`;
  }
  if(ex.note)html+=`<div class="ex-note">${ex.note}</div>`;

  if(ex.type==='bb')html+=renderBarbellSets(ex,day);
  else if(ex.type==='wt')html+=renderWeightedSets(ex,day);
  else if(ex.type==='bw')html+=renderBWSets(ex,day);

  html+=`</div>`;
  return html;
}

function countSets(ex){
  if(ex.type==='bb')return ex.ws[CFG.week-1].length;
  const deload=CFG.week===4;
  if(ex.type==='wt'){
    const base=deload?Math.max(2,ex.sets-1):ex.sets;
    const extra=!deload&&ex.badges&&ex.badges.includes('extra')?1:0;
    return base+extra;
  }
  if(ex.type==='bw')return deload?Math.max(1,ex.sets-1):ex.sets;
  return 0;
}

function renderDay(dayKey){
  const plan=getPlan();
  const day=plan[dayKey];
  let html=`<div style="font-size:12px;color:var(--text2);padding:0 4px;margin-bottom:4px">${day.subtitle}</div>`;
  if(CFG.week===4)html+=`<div class="deload-banner">\u26A1 SEMANA DELOAD - volume e intensidade reduzidos</div>`;
  html+=`<div class="progress-bar"><div class="progress-fill" id="prog-${dayKey}"></div></div>`;
  day.sections.forEach(sec=>{
    html+=`<div class="section-header">${sec.icon} ${sec.name}</div>`;
    sec.exercises.forEach(ex=>{ html+=renderExercise(ex,dayKey); });
  });
  return html;
}

function renderWeekSel(){
  let html='';
  for(let i=1;i<=4;i++){
    const active=CFG.week===i?'active':'';
    const dl=i===4?'deload':'';
    const label=i===4?'DL':'S'+i;
    html+=`<button class="week-btn ${active} ${dl}" onclick="setWeek(${i})">${label}</button>`;
  }
  document.getElementById('weekSel').innerHTML=html;
}

function renderTabs(){
  const plan=getPlan();
  let html='';
  DAYS.forEach(d=>{
    const p=plan[d];
    html+=`<button class="tab-btn" data-day="${d}" onclick="switchDay('${d}')"><span class="ti">${p.icon}</span><span class="tl">${p.name}</span></button>`;
  });
  html+=`<button class="tab-btn" data-day="dieta" onclick="switchDay('dieta')"><span class="ti">\uD83E\uDD57</span><span class="tl">Dieta</span></button>`;
  html+=`<button class="tab-btn" data-day="info" onclick="switchDay('info')"><span class="ti">\u2139\uFE0F</span><span class="tl">Info</span></button>`;
  document.getElementById('tabs').innerHTML=html;
}

function updateProgress(){
  if(currentDay==='info'||currentDay==='dieta')return;
  const plan=getPlan();
  const day=plan[currentDay];
  let total=0,filled=0;
  day.sections.forEach(sec=>{
    sec.exercises.forEach(ex=>{
      const n=countSets(ex);
      total+=n;
      for(let i=0;i<n;i++)if(isDone(currentDay,ex.id,i))filled++;
    });
  });
  const pct=total>0?(filled/total)*100:0;
  const bar=document.getElementById('prog-'+currentDay);
  if(bar)bar.style.width=pct+'%';
}

// ===== EVENTS =====
function switchDay(d){currentDay=d;render();window.scrollTo(0,0);}
function setWeek(w){CFG.week=w;saveCfg();render();}

function toggleSet(day,exId,si,el){
  const v=!isDone(day,exId,si);
  setDoneVal(day,exId,si,v);
  el.classList.toggle('done',v);
  el.querySelector('.set-check').textContent=v?'\u2713':'\u25CB';
  updateProgress();
}

function saveConfig(){
  Object.keys(DEF_CFG).forEach(k=>{
    if(k==='week')return;
    const el=document.getElementById('cfg-'+k);
    if(el){const v=parseFloat(el.value);if(!isNaN(v))CFG[k]=v;}
  });
  saveCfg();
  render();
}

function exportData(){
  const all={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('lm_'))all[k]=localStorage.getItem(k);
  }
  const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`liftmap_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importData(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const all=JSON.parse(e.target.result);
      Object.entries(all).forEach(([k,v])=>localStorage.setItem(k,v));
      CFG=loadCfg();
      render();
      alert('Dados importados!');
    }catch{alert('Erro ao importar');}
  };
  reader.readAsText(file);
}

function autoSelectDay(){
  const dow=new Date().getDay();
  const map={2:'terca',4:'quinta',6:'sabado'};
  if(map[dow])currentDay=map[dow];
}

// ===== AUTH =====
const PWD_HASH='f837af';
function simpleHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return(h>>>0).toString(16).slice(0,6);}
function checkPwd(){
  const v=document.getElementById('pwd-input').value;
  if(simpleHash(v)===PWD_HASH){
    sessionStorage.setItem('liftmap_auth','1');
    unlockApp();
  } else {
    document.getElementById('pwd-error').style.display='block';
    document.getElementById('pwd-input').value='';
  }
}
function unlockApp(){
  document.getElementById('lock-screen').style.display='none';
  document.getElementById('app-wrapper').style.display='block';
  autoSelectDay();renderTabs();render();
}

// ===== INIT =====
if(sessionStorage.getItem('liftmap_auth')==='1'){unlockApp();}
else{document.getElementById('pwd-input').focus();}
</script>
