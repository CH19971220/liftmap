<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LiftMap</title>
<meta name="description" content="LiftMap - Seu mapa de treino inteligente. Acompanhe cargas, progressao e correcoes de assimetria.">
<meta name="theme-color" content="#0f0f1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<style>
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card-hover: #22223a;
  --accent: #4361ee;
  --accent2: #7209b7;
  --success: #06d6a0;
  --warning: #ffd166;
  --danger: #ef476f;
  --text: #e8e8e8;
  --text2: #8b8b9e;
  --text3: #555568;
  --border: #2a2a3e;
  --input-bg: #12121f;
  --tab-bg: #141425;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:70px; }
.header { position:sticky; top:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:16px; font-weight:700; }
.week-nav { display:flex; align-items:center; gap:8px; }
.week-nav button { background:none; border:none; color:var(--text2); font-size:20px; padding:4px 8px; cursor:pointer; }
.week-nav span { font-size:13px; color:var(--text2); min-width:100px; text-align:center; }
.content { padding:12px 12px 20px; }
.section-header { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin:20px 0 10px; padding:0 4px; display:flex; align-items:center; gap:6px; }
.section-header:first-child { margin-top:8px; }
.exercise-card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; border:1px solid var(--border); }
.exercise-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.exercise-name { font-size:15px; font-weight:600; flex:1; line-height:1.3; }
.video-btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; white-space:nowrap; margin-left:8px; display:flex; align-items:center; gap:4px; flex-shrink:0; }
.exercise-meta { font-size:12px; color:var(--text2); margin-bottom:4px; }
.exercise-meta .method { background:var(--accent2); color:#fff; padding:1px 6px; border-radius:4px; font-size:10px; font-weight:600; margin-left:4px; }
.badges { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
.badge { font-size:10px; padding:2px 8px; border-radius:4px; font-weight:600; }
.badge-left { background:#1a3a2e; color:var(--success); border:1px solid var(--success); }
.badge-extra { background:#3a2a1a; color:var(--warning); border:1px solid var(--warning); }
.badge-asym { background:#2e1a2e; color:#c77dff; border:1px solid #c77dff; }
.exercise-note { font-size:11px; color:var(--text3); font-style:italic; margin:4px 0 8px; line-height:1.4; }
.sets-container { margin-top:8px; }
.set-block { margin-bottom:10px; }
.set-header { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.set-label { font-size:12px; color:var(--text2); min-width:24px; font-weight:700; }
.set-guide { font-size:10px; padding:2px 7px; border-radius:4px; font-weight:600; line-height:1.3; }
.set-inputs { display:flex; align-items:center; gap:4px; padding-left:30px; }
.set-input { background:var(--input-bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:14px; padding:8px 6px; width:52px; text-align:center; -moz-appearance:textfield; }
.set-input::-webkit-outer-spin-button, .set-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.set-input:focus { border-color:var(--accent); outline:none; }
.set-unit { font-size:11px; color:var(--text3); }
.set-prev { font-size:10px; color:var(--text3); margin-left:auto; white-space:nowrap; }
.done-btn { background:var(--input-bg); border:1px solid var(--border); border-radius:6px; color:var(--text2); padding:8px 12px; font-size:13px; cursor:pointer; width:100%; margin-top:4px; }
.done-btn.checked { background:#1a3a2e; border-color:var(--success); color:var(--success); }
.bottom-tabs { position:fixed; bottom:0; left:0; right:0; background:var(--tab-bg); border-top:1px solid var(--border); display:flex; z-index:100; padding-bottom:env(safe-area-inset-bottom); }
.tab-btn { flex:1; padding:10px 4px 8px; background:none; border:none; color:var(--text3); font-size:10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
.tab-btn.active { color:var(--accent); }
.tab-btn .tab-icon { font-size:18px; }
.tab-btn .tab-label { font-size:10px; font-weight:600; }
.day-subtitle { font-size:12px; color:var(--text2); padding:0 4px; margin-bottom:8px; }
.info-section { background:var(--card); border-radius:12px; padding:16px; margin-bottom:12px; border:1px solid var(--border); }
.info-section h3 { font-size:14px; margin-bottom:8px; color:var(--accent); }
.info-section p, .info-section li { font-size:13px; color:var(--text2); line-height:1.5; }
.info-section ul { padding-left:16px; }
.info-section li { margin-bottom:4px; }
.info-table { width:100%; border-collapse:collapse; margin-top:8px; }
.info-table th, .info-table td { text-align:left; padding:6px 8px; font-size:12px; border-bottom:1px solid var(--border); }
.info-table th { color:var(--accent); font-weight:600; }
.info-table td { color:var(--text2); }
.export-btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:13px; cursor:pointer; margin:4px 0; width:100%; }
.import-label { display:block; background:var(--card); color:var(--accent); border:1px dashed var(--accent); border-radius:8px; padding:10px 16px; font-size:13px; cursor:pointer; text-align:center; margin:4px 0; }
.import-label input { display:none; }
.progress-bar { height:3px; background:var(--border); border-radius:2px; margin:8px 4px 0; overflow:hidden; }
.progress-fill { height:100%; background:var(--success); border-radius:2px; transition:width .3s; }
.hidden { display:none !important; }
.brand-logo { display:flex; align-items:center; gap:8px; }
.brand-logo .logo-icon { font-size:28px; }
.brand-logo .logo-text { font-size:22px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.brand-logo .logo-sub { font-size:12px; color:var(--text2); margin-top:2px; }
.header-brand { font-size:14px; font-weight:700; background:linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.version-tag { font-size:10px; color:var(--text3); margin-top:8px; }
</style>
</head>
<body>
<div id="lock-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--bg)">
  <div style="text-align:center;margin-bottom:32px">
    <div class="brand-logo" style="flex-direction:column">
      <span class="logo-icon" style="font-size:48px">&#127947;&#65039;</span>
      <span class="logo-text" style="font-size:28px">LiftMap</span>
      <span class="logo-sub">Seu mapa de treino inteligente</span>
    </div>
  </div>
  <input id="pwd-input" type="password" placeholder="Senha" style="background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;padding:12px 16px;width:100%;max-width:260px;text-align:center;margin-bottom:12px" onkeydown="if(event.key==='Enter')checkPwd()">
  <button onclick="checkPwd()" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%;max-width:260px">Entrar</button>
  <p id="pwd-error" style="color:var(--danger);font-size:12px;margin-top:8px;display:none">Senha incorreta</p>
  <span class="version-tag">v1.0.0</span>
</div>
<div id="app-wrapper" style="display:none">
<div class="header">
  <span class="header-brand" id="headerTitle">LiftMap</span>
  <div class="week-nav">
    <button onclick="changeWeek(-1)">&lsaquo;</button>
    <span id="weekLabel"></span>
    <button onclick="changeWeek(1)">&rsaquo;</button>
  </div>
</div>
<div class="content" id="content"></div>
<nav class="bottom-tabs" id="tabs"></nav>
</div>

// ===== DATA MIGRATION =====
(function migrateFromOldKeys() {
  const migrated = localStorage.getItem('liftmap_migrated');
  if (migrated) return;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('treino_')) {
      const newKey = k.replace('treino_', 'liftmap_');
      if (!localStorage.getItem(newKey)) {
        localStorage.setItem(newKey, localStorage.getItem(k));
      }
    }
  }
  localStorage.setItem('liftmap_migrated', '1');
})();

// ===== STATE =====
let currentDay = 'terca';
let currentWeekOffset = 0;
const DAYS = ['terca','quinta','sexta','sabado'];

function getWeekKey(offset) {
  const d = new Date();
  d.setDate(d.getDate() + (offset * 7));
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const days = Math.floor((d - jan1) / 86400000);
  const week = Math.ceil((days + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
}

function getWeekLabel(offset) {
  const d = new Date();
  d.setDate(d.getDate() + (offset * 7));
  const mon = d.getDate() - d.getDay() + 1;
  const monday = new Date(d.setDate(mon));
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  if (offset === 0) return 'Esta semana';
  if (offset === -1) return 'Semana passada';
  return `${monday.getDate()} ${meses[monday.getMonth()]} - ${sunday.getDate()} ${meses[sunday.getMonth()]}`;
}

// ===== STORAGE =====
const STORAGE_PREFIX = 'liftmap_';

function loadData(weekKey) {
  try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + weekKey)) || {}; } catch { return {}; }
}
function saveData(weekKey, data) {
  localStorage.setItem(STORAGE_PREFIX + weekKey, JSON.stringify(data));
}
function getSetValue(weekKey, day, exId, setIdx, field) {
  const data = loadData(weekKey);
  return data?.[day]?.[exId]?.[setIdx]?.[field] ?? '';
}
function setSetValue(weekKey, day, exId, setIdx, field, value) {
  const data = loadData(weekKey);
  if (!data[day]) data[day] = {};
  if (!data[day][exId]) data[day][exId] = {};
  if (!data[day][exId][setIdx]) data[day][exId][setIdx] = {};
  data[day][exId][setIdx][field] = value;
  saveData(weekKey, data);
}
function isDone(weekKey, day, exId) {
  const data = loadData(weekKey);
  return data?.[day]?.[exId]?.done === true;
}
function setDone(weekKey, day, exId, val) {
  const data = loadData(weekKey);
  if (!data[day]) data[day] = {};
  if (!data[day][exId]) data[day][exId] = {};
  data[day][exId].done = val;
  saveData(weekKey, data);
}
function exportAllData() {
  const all = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(STORAGE_PREFIX)) all[k] = JSON.parse(localStorage.getItem(k));
  }
  const blob = new Blob([JSON.stringify(all, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `liftmap_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const all = JSON.parse(e.target.result);
      Object.entries(all).forEach(([k, v]) => localStorage.setItem(k, JSON.stringify(v)));
      render();
      alert('Dados importados com sucesso!');
    } catch { alert('Erro ao importar arquivo'); }
  };
  reader.readAsText(file);
}

// ===== SET GUIDE LOGIC =====
function parseReps(repsStr) {
  const match = repsStr.match(/(\d+)(?:\s*-\s*(\d+))?/);
  if (!match) return {low:10, mid:10, high:10};
  const low = parseInt(match[1]);
  const high = match[2] ? parseInt(match[2]) : low;
  const mid = Math.round((low + high) / 2);
  return {low, mid, high};
}

function repsFmt(low, high) {
  return low === high ? `${low}` : `${low}-${high}`;
}

function getSetGuide(ex, setIdx, totalSets) {
  const hasExtra = ex.badges?.includes('extra');
  const isExtra = hasExtra && setIdx === totalSets - 1;
  const baseSets = hasExtra ? totalSets - 1 : totalSets;
  const r = parseReps(ex.reps);

  if (isExtra) return {text:'Peso de trabalho \u00B7 serie extra esquerdo', bg:'#3a2a1a', color:'#ffd166'};

  if (ex.method === 'Rampa') {
    if (baseSets === 4) {
      if (setIdx===0) return {text:`Leve ~60% \u00B7 ${r.high} reps \u00B7 aquecimento`, bg:'#1a2a3a', color:'#3a86ff'};
      if (setIdx===1) return {text:`Medio ~75% \u00B7 ${r.mid} reps \u00B7 subindo`, bg:'#33301a', color:'#ffd166'};
      if (setIdx===2) return {text:`Trabalho ~90% \u00B7 ${repsFmt(r.low,r.mid)} reps \u00B7 2-3 RIR`, bg:'#1a3a2e', color:'#06d6a0'};
      if (setIdx===3) return {text:`Trabalho 100% \u00B7 ${r.low} reps \u00B7 1-2 RIR`, bg:'#1a3a2e', color:'#06d6a0'};
    }
    if (baseSets === 3) {
      if (setIdx===0) return {text:`Leve ~65% \u00B7 ${r.high} reps \u00B7 aquecimento`, bg:'#1a2a3a', color:'#3a86ff'};
      if (setIdx===1) return {text:`Medio ~80% \u00B7 ${r.mid} reps \u00B7 subindo`, bg:'#33301a', color:'#ffd166'};
      if (setIdx===2) return {text:`Trabalho 100% \u00B7 ${r.low} reps \u00B7 1-2 RIR`, bg:'#1a3a2e', color:'#06d6a0'};
    }
  }

  if (ex.method === 'Fixo') {
    const rng = repsFmt(r.low, r.high);
    if (baseSets === 1) return {text:`Peso de trabalho \u00B7 ${rng} reps \u00B7 1-2 RIR`, bg:'#1a2a3a', color:'#8ecae6'};
    if (setIdx === 0) return {text:`Peso de trabalho \u00B7 ${rng} reps \u00B7 3 RIR`, bg:'#1a2a3a', color:'#8ecae6'};
    if (setIdx === baseSets - 1) return {text:`Mesmo peso \u00B7 max reps \u00B7 0-1 RIR (falha)`, bg:'#1a2a3a', color:'#8ecae6'};
    return {text:`Mesmo peso \u00B7 ${rng} reps \u00B7 2 RIR`, bg:'#1a2a3a', color:'#8ecae6'};
  }

  if (ex.method === 'Leve') {
    if (setIdx === 0) return {text:'Peso leve (2-4kg) \u00B7 foco na tecnica e contracao', bg:'#1a2a3a', color:'#8ecae6'};
    return {text:'Mesmo peso leve \u00B7 manter qualidade', bg:'#1a2a3a', color:'#8ecae6'};
  }

  if (ex.method === 'Core') {
    if (baseSets <= 1) return {text:'Peso moderado \u00B7 controle total', bg:'#1a3a2e', color:'#06d6a0'};
    if (setIdx === 0) return {text:'Peso moderado \u00B7 controle total \u00B7 3 RIR', bg:'#1a3a2e', color:'#06d6a0'};
    if (setIdx === baseSets - 1) return {text:'Mesmo peso \u00B7 controle total \u00B7 1-2 RIR', bg:'#1a3a2e', color:'#06d6a0'};
    return {text:'Mesmo peso \u00B7 manter controle', bg:'#1a3a2e', color:'#06d6a0'};
  }

  return {text:'', bg:'transparent', color:'var(--text3)'};
}

// ===== RENDERING =====
function methodColor(m) {
  const map = {Rampa:'#7209b7',Fixo:'#3a86ff',Core:'#06d6a0',McGill:'#ff6b35',Leve:'#8ecae6',aquec:'#555568',Mob:'#c77dff'};
  return map[m] || '#555568';
}

function renderExercise(ex, day) {
  const wk = getWeekKey(currentWeekOffset);
  const prevWk = getWeekKey(currentWeekOffset - 1);
  const done = isDone(wk, day, ex.id);
  let html = '<div class="exercise-card">';
  html += '<div class="exercise-top">';
  html += `<span class="exercise-name">${ex.name}</span>`;
  html += `<button class="video-btn" onclick="window.open('https://www.youtube.com/results?search_query=${encodeURIComponent(ex.video)}','_blank')">&#9654; Video</button>`;
  html += '</div>';
  html += `<div class="exercise-meta">${ex.sets}x${ex.reps}`;
  if (ex.method && ex.method !== 'aquec') html += ` <span class="method" style="background:${methodColor(ex.method)}">${ex.method}</span>`;
  html += '</div>';
  if (ex.badges) {
    html += '<div class="badges">';
    if (ex.badges.includes('left')) html += '<span class="badge badge-left">\u2B05 Esquerdo primeiro</span>';
    if (ex.badges.includes('extra')) html += '<span class="badge badge-extra">+ Serie extra esquerdo</span>';
    if (ex.badges.includes('asym')) html += '<span class="badge badge-asym">\u2696 Assimetrico (E>D)</span>';
    html += '</div>';
  }
  if (ex.note) html += `<div class="exercise-note">${ex.note}</div>`;

  if (ex.track) {
    html += '<div class="sets-container">';
    const numSets = ex.badges?.includes('extra') ? ex.sets + 1 : ex.sets;
    for (let i = 0; i < numSets; i++) {
      const isExtra = ex.badges?.includes('extra') && i === numSets - 1;
      const label = isExtra ? 'E+' : `S${i+1}`;
      const guide = getSetGuide(ex, i, numSets);
      const pw = getSetValue(prevWk, day, ex.id, i, 'w');
      const pr = getSetValue(prevWk, day, ex.id, i, 'r');
      const cw = getSetValue(wk, day, ex.id, i, 'w');
      const cr = getSetValue(wk, day, ex.id, i, 'r');
      html += '<div class="set-block">';
      html += '<div class="set-header">';
      html += `<span class="set-label"${isExtra?' style="color:var(--warning)"':''}>${label}</span>`;
      if (guide.text) html += `<span class="set-guide" style="background:${guide.bg};color:${guide.color}">${guide.text}</span>`;
      html += '</div>';
      html += '<div class="set-inputs">';
      html += `<input class="set-input" type="number" inputmode="decimal" placeholder="-" value="${cw}" onchange="setSetValue('${wk}','${day}','${ex.id}',${i},'w',this.value);updateProgress()">`;
      html += '<span class="set-unit">kg</span>';
      html += '<span class="set-unit" style="margin:0 2px">\u00D7</span>';
      html += `<input class="set-input" type="number" inputmode="numeric" placeholder="-" value="${cr}" onchange="setSetValue('${wk}','${day}','${ex.id}',${i},'r',this.value);updateProgress()" style="width:42px">`;
      html += '<span class="set-unit">reps</span>';
      if (pw || pr) html += `<span class="set-prev">ant: ${pw||'?'}\u00D7${pr||'?'}</span>`;
      html += '</div></div>';
    }
    html += '</div>';
  } else {
    html += `<button class="done-btn ${done?'checked':''}" onclick="toggleDone(this,'${wk}','${day}','${ex.id}')">${done?'\u2713 Feito':'Marcar como feito'}</button>`;
  }
  html += '</div>';
  return html;
}

function renderDay(dayKey) {
  const day = PLAN[dayKey];
  let html = `<div class="day-subtitle">${day.subtitle}</div>`;
  html += `<div class="progress-bar"><div class="progress-fill" id="progress-${dayKey}"></div></div>`;
  day.sections.forEach(sec => {
    html += `<div class="section-header">${sec.icon} ${sec.name}</div>`;
    sec.exercises.forEach(ex => { html += renderExercise(ex, dayKey); });
  });
  return html;
}

function render() {
  document.getElementById('weekLabel').textContent = getWeekLabel(currentWeekOffset);
  const content = document.getElementById('content');
  if (currentDay === 'info') {
    content.innerHTML = renderInfo();
    document.getElementById('headerTitle').textContent = 'Informacoes';
  } else {
    content.innerHTML = renderDay(currentDay);
    document.getElementById('headerTitle').textContent = PLAN[currentDay].fullName;
    updateProgress();
  }
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.day === currentDay);
  });
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  let html = '';
  DAYS.forEach(d => {
    const p = PLAN[d];
    html += `<button class="tab-btn" data-day="${d}" onclick="switchDay('${d}')"><span class="tab-icon">${p.icon}</span><span class="tab-label">${p.name}</span></button>`;
  });
  html += '<button class="tab-btn" data-day="info" onclick="switchDay(\'info\')"><span class="tab-icon">\u2139\uFE0F</span><span class="tab-label">Info</span></button>';
  tabs.innerHTML = html;
}

function updateProgress() {
  if (currentDay === 'info') return;
  const wk = getWeekKey(currentWeekOffset);
  const data = loadData(wk);
  const dayData = data[currentDay] || {};
  const day = PLAN[currentDay];
  let total = 0, filled = 0;
  day.sections.forEach(sec => {
    sec.exercises.forEach(ex => {
      if (ex.track) {
        const numSets = ex.badges?.includes('extra') ? ex.sets + 1 : ex.sets;
        total += numSets;
        for (let i = 0; i < numSets; i++) {
          if (dayData[ex.id]?.[i]?.w && dayData[ex.id]?.[i]?.r) filled++;
        }
      } else {
        total++;
        if (dayData[ex.id]?.done) filled++;
      }
    });
  });
  const pct = total > 0 ? (filled / total) * 100 : 0;
  const bar = document.getElementById(`progress-${currentDay}`);
  if (bar) bar.style.width = `${pct}%`;
}

// ===== EVENTS =====
function switchDay(d) { currentDay = d; render(); window.scrollTo(0, 0); }
function changeWeek(dir) { currentWeekOffset += dir; render(); }
function toggleDone(btn, wk, day, exId) {
  const val = !isDone(wk, day, exId);
  setDone(wk, day, exId, val);
  btn.classList.toggle('checked', val);
  btn.textContent = val ? '\u2713 Feito' : 'Marcar como feito';
  updateProgress();
}

function autoSelectDay() {
  const dow = new Date().getDay();
  const map = {2:'terca', 4:'quinta', 5:'sexta', 6:'sabado'};
  if (map[dow]) currentDay = map[dow];
}

const PWD_HASH = 'f837af';
function simpleHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return(h>>>0).toString(16).slice(0,6);}
function checkPwd(){
  const v=document.getElementById('pwd-input').value;
  if(simpleHash(v)===PWD_HASH){
    sessionStorage.setItem('liftmap_auth','1');
    unlockApp();
  } else {
    document.getElementById('pwd-error').style.display='block';
    document.getElementById('pwd-input').value='';
  }
}
function unlockApp(){
  document.getElementById('lock-screen').style.display='none';
  document.getElementById('app-wrapper').style.display='block';
  autoSelectDay();renderTabs();render();
}
